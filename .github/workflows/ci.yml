name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATAGSM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start PostgreSQL and Redis
        id: services
        run: docker compose up -d --wait --wait-timeout 120
      - name: Run unit and API contract tests
        run: bash ./gradlew test --no-daemon
      - name: Run infrastructure and authentication integration tests
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        run: bash ./gradlew integrationTest --no-daemon
      - name: Check and package application
        run: bash ./gradlew check bootJar --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/**/TEST-*.xml
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop local services
        if: always()
        run: docker compose down
